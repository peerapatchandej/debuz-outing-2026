/* Layout: game-show screen. Top bar (results left, icon tools right), title, progress road,
   chunky tiles (opened in order 1 → last) on the left, scoreboard on the right. Separate views by hash:
   #team-N (team phone), #score (backstage scorer), #join (team picker). Single light look: blue / orange / white. */
/* overlays (.ov/.tov/.toast/.tv) set display, which beats the browser's default [hidden] rule when opened as a plain file */
[hidden]{display:none!important}
:root{
  --bg:#f2f7fc; --sky:#d7e9fb; --surface:#ffffff; --soft:#e8f1fb; --line:#d9e5f1; --edge:#c3d6ee;
  --blue:#1f6fd1; --blue-deep:#124f9e; --blue-edge:#0c3d7c;
  --orange:#f47b20; --orange-soft:#fff2e7; --orange-edge:#bd560b;
  --ink:#173452; --muted:#6b8099; --danger:#e0561b; --ok:#1d8f5a;
  --t-compass:#1f6fd1; --t-friend:#2ea3dc; --t-idea:#f2a516; --t-fun:#f47b20; --t-luck:#2c4a86; --t-choice:#7b4fd6;
  --display:"Mitr","Anuphan","Noto Sans Thai",Tahoma,sans-serif;
  --body:"Anuphan","Noto Sans Thai",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background:radial-gradient(circle at 1px 1px,rgba(31,111,209,.12) 1.3px,transparent 1.5px) 0 0/24px 24px,linear-gradient(180deg,var(--sky) 0,var(--bg) 360px),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--orange) 70%,transparent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.spacer{flex:1}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* buttons */
.btn{border:0;border-radius:14px;font:600 1rem var(--display);padding:10px 18px;cursor:pointer;background:var(--surface);color:var(--blue);
  display:inline-flex;align-items:center;gap:8px;box-shadow:0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn.go{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-edge)} .btn.go:active{box-shadow:0 1px 0 var(--blue-edge)}
.btn.hot{background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-edge)} .btn.hot:active{box-shadow:0 1px 0 var(--orange-edge)}
.btn.warn{color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn svg{width:22px;height:22px}
.mini{border:0;background:var(--surface);color:var(--blue);border-radius:9px;font:600 .9rem var(--display);padding:4px 10px;cursor:pointer;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.mini:hover{background:var(--soft)}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.mini.neg{color:var(--muted)}
.ib{position:relative;width:46px;height:46px;border:0;border-radius:14px;background:var(--surface);color:var(--blue);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s}
.ib svg{width:22px;height:22px}
.ib:hover{background:var(--soft)}
.ib:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.ib.armed{background:var(--danger);color:#fff;box-shadow:0 5px 0 #9b3610}
.ib[data-tip]:hover::after,.ib[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);right:0;white-space:nowrap;background:var(--blue-deep);color:#fff;
  font:500 .8rem var(--display);padding:4px 10px;border-radius:8px;z-index:5;pointer-events:none}
.ib.del{color:var(--danger)}
.ib.del.armed{color:#fff}
.ib.del[data-tip]:hover::after,.ib.del.armed::after{content:attr(data-tip);position:absolute;top:auto;bottom:calc(100% + 10px);right:0;white-space:nowrap;background:var(--blue-deep);color:#fff;font:500 .8rem var(--display);padding:4px 10px;border-radius:8px;z-index:5;pointer-events:none}
.ibar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* top + header */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#resultBtn{font-size:1.05rem;padding:11px 20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.eyebrow{display:inline-block;background:var(--orange);color:#fff;padding:3px 14px;border-radius:999px;box-shadow:0 3px 0 var(--orange-edge);font:500 .82rem var(--display)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,5.4vw,4.2rem);line-height:1.1;margin:10px 0 6px;text-wrap:balance;color:var(--blue);text-shadow:0 4px 0 #fff,0 8px 0 rgba(18,79,158,.16)}
h1 em{font-style:normal;color:var(--orange);text-shadow:0 4px 0 #fff,0 8px 0 rgba(189,86,11,.22)}
.sub{margin:0;color:var(--muted);max-width:60ch}

/* road */
.road{position:relative;height:62px;border-radius:999px;background:var(--surface);box-shadow:0 6px 0 var(--edge)}
.road::before{content:"";position:absolute;left:28px;right:96px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--soft) 0 14px,#fff 14px 22px)}
.road .track{position:absolute;left:28px;right:96px;top:0;bottom:0}
.road .mk{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--surface);border:3px solid var(--edge);
  font:600 .8rem var(--display);display:grid;place-items:center;color:var(--muted);transition:background .3s,color .3s}
.road .mk.on{background:var(--blue);border-color:#fff;box-shadow:0 0 0 2px var(--blue);color:#fff}
.road .mk.sec{border-style:dashed;color:var(--orange)}
.road .mk.sec.on{background:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.road .car{position:absolute;top:50%;width:44px;height:24px;margin:-24px 0 0 -22px;transition:left .9s cubic-bezier(.3,.9,.3,1);animation:bob 1.2s ease-in-out infinite}
.road .goal{position:absolute;right:8px;top:8px;bottom:8px;width:80px;display:grid;place-items:center;border-radius:999px;background:var(--orange);color:#fff;font:600 1.1rem var(--display);box-shadow:0 3px 0 var(--orange-edge)}
.prog{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.9rem;margin-top:-4px;padding:0 6px}
.prog b{color:var(--blue);font-family:var(--display);font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:#2bb673}

/* board */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:1020px){.main{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:16px}
@media (max-width:640px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;aspect-ratio:1/0.9;max-width:100%;border:0;border-radius:22px;cursor:pointer;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--blue);font-family:var(--display);
  box-shadow:0 9px 0 var(--edge),0 16px 26px rgba(23,52,82,.10);transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-5px) rotate(-1.5deg);box-shadow:0 14px 0 var(--edge),0 22px 30px rgba(31,111,209,.16)}
.tile:active{transform:translateY(7px);box-shadow:0 2px 0 var(--edge)}
.tile .ex{font-size:.82rem;color:var(--muted);font-weight:500}
.tile .num{font-size:clamp(2.4rem,5.4vw,4.2rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 5px 0 var(--soft)}
.tile:not(.done):not(.secret)::after{content:"?";position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;
  font:600 1.05rem var(--display);display:grid;place-items:center;box-shadow:0 3px 0 var(--orange-edge)}
/* sequential play: later tiles are muted until their turn; the next tile bobs */
.tile.later{opacity:.55;cursor:not-allowed}
.tile.later:hover{transform:none}
.tile.nudge{animation:pop .45s ease 2}
.tile.pickme{box-shadow:0 9px 0 var(--edge),0 0 0 5px var(--orange-soft),0 0 26px rgba(244,123,32,.35);animation:bob 1.4s ease-in-out infinite}
.tile.done{background:color-mix(in srgb,var(--c) 9%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 30%,var(--edge))}
.tile.done:hover{transform:translateY(-2px)}
.tile.done .num{font-size:.9rem;color:var(--muted);font-weight:500;order:-1;text-shadow:none}
.tile.done .num::before{content:"ช่อง "}
.tile.done .ico{width:clamp(32px,3.6vw,44px);height:clamp(32px,3.6vw,44px);color:var(--c)}
.tile.done .tl{font-size:1.05rem;font-weight:600;color:var(--ink)}
.tile.done .by{font-family:var(--body);font-size:.8rem;color:var(--muted)}
.tile.secret{grid-column:1/-1;aspect-ratio:auto;min-height:104px;flex-direction:row;gap:18px;color:#fff;
  background:var(--blue-deep) repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 16px,transparent 16px 32px);box-shadow:0 9px 0 var(--blue-edge),0 16px 26px rgba(18,79,158,.2)}
.tile.secret:hover{transform:translateY(-4px);box-shadow:0 13px 0 var(--blue-edge),0 22px 30px rgba(18,79,158,.25)}
.tile.secret:active{transform:translateY(7px);box-shadow:0 2px 0 var(--blue-edge)}
.tile.secret .lock{width:54px;height:54px;border-radius:16px;background:var(--orange);display:grid;place-items:center;box-shadow:0 4px 0 var(--orange-edge);flex:none}
.tile.secret .lock svg{width:30px;height:30px}
.tile.secret .st{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tile.secret .st b{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:600}
.tile.secret .st span{font-family:var(--body);font-size:.9rem;opacity:.85}
.tile.secret .qs{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:600;letter-spacing:.3em;color:var(--orange)}
.tile.secret.ready{box-shadow:0 9px 0 var(--blue-edge),0 0 0 5px var(--orange-soft),0 0 30px rgba(244,123,32,.45);animation:bob 1.4s ease-in-out infinite}
.tile.secret.done{background:color-mix(in srgb,var(--t-idea) 12%,#fff);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--t-idea) 35%,var(--edge))}
.tile.secret.done .qs{display:none}
.tile.secret.done .st span{color:var(--muted)}

/* scoreboard */
.panel{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 var(--edge),0 16px 30px rgba(23,52,82,.08)}
.panel h2{font:600 1.25rem var(--display);margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--blue-deep)}
.panel h2 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400;text-align:right}
.lanes{display:flex;flex-direction:column;gap:9px}
.lane{position:relative;display:grid;grid-template-columns:minmax(0,7.2rem) minmax(0,1fr) 2.6ch auto;align-items:center;gap:10px}
.lane .nm{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:500;font-size:.95rem;white-space:nowrap;min-width:0}
.lane .nm .t{overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font:600 .8rem var(--display);display:grid;place-items:center;box-shadow:0 2px 0 var(--blue-edge)}
.lane.lead .av{background:var(--orange);box-shadow:0 2px 0 var(--orange-edge)}
.crown{width:18px;height:14px;flex:none;color:var(--orange)}
.lane .tr{position:relative;height:18px;border-radius:999px;background:var(--soft);overflow:hidden;box-shadow:inset 0 2px 0 rgba(18,79,158,.08)}
.lane .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--blue);transition:width .7s cubic-bezier(.3,.9,.3,1);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 7px,transparent 7px 14px);background-size:20px 20px;animation:stripes 1s linear infinite}
.lane.lead .fill{background-color:var(--orange)}
.lane .sc{font:600 1.45rem var(--display);text-align:right;font-variant-numeric:tabular-nums;color:var(--blue-deep)}
.lane.lead .sc{color:var(--orange)}
.lane .bb{display:flex;gap:4px}
.lane .bb .mini:disabled{opacity:.4;cursor:default;box-shadow:none}
.pop{position:absolute;right:56px;top:-8px;font:600 1.2rem var(--display);color:var(--orange);pointer-events:none;animation:rise 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
.pop.neg{color:var(--blue)}
.bump{animation:bump .5s ease}

/* overlay + cards */
.ov{position:fixed;inset:0;z-index:30;background:rgba(18,48,84,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.card,.sheet{max-height:100%;overflow:auto;background:var(--surface);border:4px solid #fff;box-shadow:0 24px 60px rgba(18,48,84,.25);animation:popin .42s cubic-bezier(.2,1.4,.4,1)}
.card{width:min(1160px,100%);border-radius:24px;display:flex;flex-direction:column}
.band{display:flex;align-items:center;gap:14px;padding:16px 22px;color:var(--on,#fff);border-radius:20px 20px 0 0;
  background:var(--c) repeating-linear-gradient(-45deg,rgba(255,255,255,.10) 0 14px,transparent 14px 28px)}
.band .ico{width:52px;height:52px;flex:none;background:rgba(255,255,255,.22);border-radius:14px;padding:6px}
.band .bt{font:600 1.6rem var(--display);line-height:1.2}
.band .bo{font-size:.9rem;opacity:.9}
.band .x{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:inherit;border-radius:10px;padding:8px 16px;font:500 1rem var(--display);cursor:pointer}
.band .x:hover{background:rgba(255,255,255,.35)}
.cbody{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px;padding:24px 26px 26px}
@media (max-width:820px){.cbody{grid-template-columns:1fr}}
.qcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.q{font:600 clamp(1.5rem,3.2vw,2.5rem)/1.3 var(--display);margin:0;text-wrap:balance;color:var(--blue-deep)}
.how{font-size:clamp(1.02rem,1.7vw,1.25rem);margin:0;max-width:62ch}
.pts{align-self:flex-start;font:500 1.05rem var(--display);background:var(--orange-soft);color:#c25a0c;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(189,86,11,.18)}
.ph{color:var(--orange);font-weight:600}
.ans{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:1.2rem;min-height:3.2em;position:relative}
.ans .cover{position:absolute;inset:0;border:0;border-radius:14px;width:100%;cursor:pointer;color:#fff;font:500 1.15rem var(--display);display:grid;place-items:center;
  background:var(--blue) repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 12px,transparent 12px 24px)}
.ans .k{font:500 .8rem var(--display);color:var(--muted);display:block;margin-bottom:2px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-family:var(--display);color:var(--blue-deep)}
.timer{display:flex;flex-direction:column;align-items:center;gap:10px}
.ring{position:relative;width:190px;height:190px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--blue);transition:stroke-dashoffset 1s linear,stroke .3s}
.ring.low .fg{stroke:var(--orange)}
.ring .tt{position:absolute;inset:0;display:grid;place-items:center;font:600 2.8rem var(--display);font-variant-numeric:tabular-nums;color:var(--blue-deep)}
.ring.low .tt{color:var(--orange);animation:pulse 1s ease-in-out infinite}
.ring.end .tt{font-size:1.5rem;color:var(--orange)}
.ring .tt.cd{animation:cd .6s ease-out}
.trow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.notime{background:var(--soft);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-family:var(--display)}
.scoring{grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.scoring h4,.luck h4{margin:0;font:500 1rem var(--display);color:var(--muted)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.cnt{font:500 .95rem var(--display);color:var(--blue);background:var(--soft);padding:4px 12px;border-radius:999px}
.cnt.closed{background:var(--orange-soft);color:#c25a0c}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sbox{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--edge)}
.sbox.hit{background:var(--orange-soft);box-shadow:0 4px 0 rgba(244,123,32,.45)}
.sbox .sh{display:flex;align-items:center;gap:6px}
.sbox b{font:500 1rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sbox .got{font:600 .95rem var(--display);color:var(--orange);min-width:2.4ch;text-align:right}
.sa{font-size:.95rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;min-height:1.6em;white-space:pre-wrap;word-break:break-word}
.sa.in{color:var(--blue);font-weight:500}
.sa.show{color:var(--ink);font-size:clamp(1.05rem,1.8vw,1.35rem);font-weight:500;animation:popin .4s ease}
.luck{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:14px;padding:14px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.luck .mini:disabled{opacity:.5;cursor:default;box-shadow:none}
/* จริงหรือมั่ว: question counter on the card, question list in the editor */
.tfitem{display:flex;flex-direction:column;gap:18px}
.tfnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tfno{background:var(--c);color:var(--on);font:600 .95rem var(--display);padding:4px 14px;border-radius:999px}
.tft{font:500 1rem var(--display);color:var(--muted)}
.tfed{display:flex;flex-direction:column;gap:10px}
.tfed .ml{font:500 .82rem var(--display);color:var(--muted)}
.tfrow{border:2px solid var(--edge);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tfh{display:flex;align-items:center;justify-content:space-between;font:500 .95rem var(--display);color:var(--ink)}
.tfopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.tfopts{grid-template-columns:1fr}}
.tfed [data-tfadd]{align-self:flex-start}

/* timer pop-up */
.tbig{width:100%;border:0;border-radius:22px;cursor:pointer;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 14px;
  box-shadow:0 6px 0 var(--blue-edge);transition:transform .08s,box-shadow .08s;font-family:var(--display)}
.tbig:active{transform:translateY(5px);box-shadow:0 1px 0 var(--blue-edge)}
.tbig svg{width:34px;height:34px}
.tbig .mc{font:600 2.6rem var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.tbig .ml{font-size:.9rem;opacity:.9}
.tbig.run{animation:bob 1.2s ease-in-out infinite}
.tbig.low,.tbig.end{background:var(--orange);box-shadow:0 6px 0 var(--orange-edge)}
.tov{position:fixed;inset:0;z-index:35;background:rgba(18,48,84,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.tbox{width:min(900px,100%);max-height:100%;overflow:auto;background:var(--surface);border:4px solid #fff;border-radius:28px;padding:22px 26px 28px;display:flex;flex-direction:column;align-items:center;gap:18px;
  box-shadow:0 12px 0 var(--edge),0 30px 70px rgba(18,48,84,.35);animation:popin .4s cubic-bezier(.2,1.4,.4,1)}
.thead{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.tq{font:500 clamp(1.05rem,2vw,1.4rem)/1.35 var(--display);color:var(--blue-deep);text-wrap:balance}
.ring.big{width:min(52vh,72vw,520px);height:min(52vh,72vw,520px)}
.tq .tdesc{display:block;margin:10px 0 0;padding:10px 14px;background:var(--soft);border-radius:14px;font:400 clamp(1rem,1.7vw,1.2rem)/1.55 var(--body);color:var(--ink);text-wrap:pretty}
.tq .tdesc b{display:block;font:500 .8rem var(--display);color:var(--blue);margin-bottom:2px}
.ring.big .tt{font-size:clamp(3.4rem,min(15vh,17vw),9rem)}
.ring.big.end .tt{font-size:clamp(2.6rem,min(10vh,12vw),6rem)}
.btn.big{font-size:1.25rem;padding:14px 28px}
.qrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.qrow .q{flex:1;min-width:0}
.qrow .pts,.thead .pts{flex:0 1 auto;width:max-content;max-width:min(26%,15rem);margin-top:6px;text-align:center;font-size:.88rem;line-height:1.35;padding:5px 12px;border-radius:14px}
.thead .tq{flex:1;min-width:0}
.thead .pts{margin-top:2px}
.ring.big .tt{line-height:1;color:var(--blue-deep)}
.ring.big.low .tt,.ring.big.end .tt{color:var(--orange)}
.ring.big .tt.cd{color:var(--blue-deep)}
.ring.big.low .tt{animation:none}
.tbox{overflow:hidden auto}
.stm textarea{font-size:1.05rem;min-height:3.4em;background:var(--bg);border:2px solid var(--soft);border-radius:12px}
.stm textarea:focus{border-color:var(--blue);background:#fff}
.stm .sv{font:500 .85rem var(--display);color:var(--muted);min-height:1.2em}
.stm .sv.ok{color:var(--ok)} .stm .sv.err{color:var(--danger)}
.edrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;cursor:pointer;font-family:var(--display);font-weight:500;transition:border-color .15s,background .15s}
.edrow:hover{border-color:var(--blue);background:var(--soft)}
.edrow .n,.epop .n{background:var(--soft);color:var(--blue);border-radius:8px;min-width:2.2em;text-align:center;padding:1px 6px;flex:none}
.edrow .ty{color:var(--c);flex:none}
.edrow .s{color:var(--muted);font-family:var(--body);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.edrow .pen{flex:none;width:20px;height:20px;color:var(--blue);opacity:.7}
.edrow .pen svg{width:100%;height:100%}
.edrow:hover .pen{opacity:1}
#eov{z-index:36}
.epop{width:min(760px,100%)}
.epop h3{display:flex;align-items:center;gap:10px}
.epop .n{background:var(--c);color:#fff;font-size:1.1rem}
.epop .form{padding:0}
.epop>.row{justify-content:flex-end}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{border:0;border-radius:12px;background:var(--bg);box-shadow:0 3px 0 var(--edge);padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;font-family:var(--display);position:relative}
.qchip b{font-weight:600;color:var(--blue-deep);font-size:.95rem}
.qchip span{font-size:.75rem;color:var(--c)}
.qchip.on{background:var(--blue);box-shadow:0 3px 0 var(--blue-edge)}
.qchip.on b,.qchip.on span{color:#fff}
.qchip.live::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid #fff}
.qtext{margin:0;font-size:1.05rem;color:var(--ink)}
.qtext b{font-family:var(--display);color:var(--blue-deep);margin-right:6px}
.livetag{display:inline-block;background:var(--orange);color:#fff;font-size:.75rem;padding:1px 8px;border-radius:999px;vertical-align:middle}
.tsc .sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tsc .sh-h h4{margin:0}
.qchip.locked{background:var(--bg);box-shadow:none;border:1px dashed var(--edge);cursor:not-allowed;opacity:.75}
.qchip.locked b{color:var(--muted)}
.qchip.locked span{color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.qchip.locked span svg{width:11px;height:11px}
/* ===== scorer page polish ===== */
.tv.wide{gap:16px}
.sctop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sctop .brand{display:flex;flex-direction:column;line-height:1.15;font:600 1.5rem var(--display);color:var(--blue-deep)}
.sctop .brand em{font-style:normal;color:var(--orange)}
.sctop .brand small{font:500 .85rem var(--display);color:var(--muted)}
.sctop .row{gap:10px}
.sctop .btn{text-decoration:none}
.scmode{display:flex;gap:10px;align-items:flex-start;background:#fff4e9;border:2px solid #ffc999;color:#7a3a06;border-radius:16px;padding:12px 16px;font-size:.95rem;line-height:1.5}
.scmode b{font-family:var(--display);font-weight:600}
.scmode code{background:#fff;border-radius:6px;padding:1px 6px;font-size:.88rem;word-break:break-all}
.scempty{background:var(--surface);border:2px dashed var(--edge);border-radius:18px;padding:16px 18px;color:var(--muted);font-family:var(--display);text-align:center}
.tcard.sclive .inner{flex-direction:row;align-items:center;gap:18px;padding:16px 20px}
.sclive .ql{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.sclive .q{font-size:clamp(1.15rem,2.2vw,1.5rem);margin:0}
.sclive .livetag{align-self:flex-start}
.sclive .row{gap:10px}
.sclive .stat{margin:0;font-size:.9rem;text-align:left}
.sclive .tclock{flex:none;min-width:6.5rem;background:var(--soft);border-radius:16px;padding:10px 14px;font-size:2rem}
.scpanel{background:var(--surface);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--edge)}
.sc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sc-h h4{margin:0;font:600 1.1rem var(--display);color:var(--blue-deep)}
.sc-h .hint{margin-top:2px}
.qchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.qchip{align-items:stretch;padding:8px 12px;border-radius:14px}
.qtext{background:var(--soft);border-radius:12px;padding:10px 14px}
.qtext:empty{display:none}
.seg{display:inline-flex;align-items:stretch;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:#fff;color:var(--blue);font:600 1rem var(--display);padding:8px 0;min-width:3rem;border-radius:9px;cursor:pointer;box-shadow:0 2px 0 var(--edge);transition:transform .08s,box-shadow .08s,background .15s}
.seg button:hover{background:var(--blue);color:#fff}
.seg button:active{transform:translateY(2px);box-shadow:none}
.seg button.neg{color:var(--muted)}
.seg button.neg:hover{background:var(--muted);color:#fff}
.seg.all{align-items:center}
.seg.all span{font:500 .85rem var(--display);color:var(--muted);padding:0 8px}
.scgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.stm{background:var(--bg);box-shadow:none;border:1px solid var(--line);gap:10px;padding:14px}
.stm .h b{font-size:1.15rem}
.stm .av{width:30px;height:30px;font-size:.95rem}
.stm .big{display:flex;align-items:baseline;gap:4px;font:600 2rem var(--body);color:var(--blue-deep);line-height:1}
.stm .big small{font:500 .8rem var(--display);color:var(--muted)}
.ansbox{display:flex;flex-direction:column;gap:4px}
.ansbox label{font:500 .8rem var(--display);color:var(--muted)}
.ansbox.off{border:2px dashed var(--edge);border-radius:12px;padding:12px;color:var(--muted);font:500 .9rem var(--display);text-align:center}
.stm textarea{background:#fff;border:2px solid var(--line)}
.stm .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stm .foot .seg{flex:1;justify-content:flex-end;min-width:0}
.stm .foot .seg button{flex:1;min-width:0}
.stm .rt{min-height:0;font-size:.9rem;white-space:nowrap}
.stm .rt:empty{display:none}
.sclog summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.sclog summary::-webkit-details-marker{display:none}
.sclog summary h4{margin:0;font:600 1.1rem var(--display);color:var(--blue-deep);flex:1}
.sclog .chev{color:var(--blue);transition:transform .2s}
.sclog[open] .chev{transform:rotate(180deg)}
.sctop .ib[data-tip]:hover::after,.sctop .ib[data-tip]:focus-visible::after{top:calc(100% + 10px)}
@media (max-width:560px){.tcard.sclive .inner{flex-direction:column;align-items:stretch}.sclive .tclock{align-self:center}}
/* scorer mini board (same look as the projector board) */
.qchips.board{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:12px;padding-top:6px}
@media (max-width:760px){.qchips.board{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}}
.qtile{position:relative;border:0;border-radius:18px;background:#fff;aspect-ratio:1/0.86;max-width:100%;min-width:0;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--display);color:var(--blue);box-shadow:0 6px 0 var(--edge),0 10px 18px rgba(23,52,82,.08)}
.qtile .ex{font-size:.8rem;color:var(--muted);font-weight:500}
.qtile .num{font-size:clamp(1.8rem,3.6vw,3rem);font-weight:600;line-height:1;text-shadow:0 4px 0 var(--soft)}
.qtile:not(.done):not(.secret)::after{content:"?";position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;font:600 .85rem var(--display);display:grid;place-items:center;box-shadow:0 2px 0 var(--orange-edge)}
.qtile[disabled]{cursor:not-allowed}
.qtile[disabled]:not(.secret){background:#e6ebf1;color:#9aa8b8;box-shadow:0 5px 0 #cfd7e1}
.qtile[disabled]:not(.secret) .ex{color:#9aa8b8}
.qtile[disabled]:not(.secret) .num{text-shadow:none}
.qtile[disabled]:not(.secret)::after{background:#c3cdd8;box-shadow:0 2px 0 #aeb9c6;color:#fff}
.qtile.secret[disabled]{background:#dfe5ec;color:#7d8b9b;box-shadow:0 5px 0 #c6cfda}
.qtile.secret[disabled] .lk{background:#b9c4d0;box-shadow:0 3px 0 #a3afbd}
.qtile.secret[disabled] .qs{color:#a3afbd}
.qtile.done{cursor:pointer;background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 32%,var(--edge));transition:transform .12s}
.qtile.done:hover{transform:translateY(-3px)}
.qtile.done:active{transform:translateY(2px)}
.qtile .no{font-size:.75rem;color:var(--muted);font-weight:500}
.qtile .ico{width:clamp(24px,2.6vw,34px);height:clamp(24px,2.6vw,34px);color:var(--c)}
.qtile .ico svg{width:100%;height:100%}
.qtile .tl{font-size:clamp(.82rem,1.3vw,1rem);font-weight:600;color:var(--ink);white-space:nowrap}
.qtile .by{font-family:var(--body);font-size:.72rem;color:var(--muted);min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qtile .ac{position:absolute;top:6px;right:6px;font-size:.7rem;font-weight:600;background:#fff;color:var(--blue);border-radius:999px;padding:1px 7px;box-shadow:0 1px 0 var(--edge)}
.qtile .ac.full{background:var(--ok);color:#fff;box-shadow:none}
.qtile.on{outline:3px solid var(--blue);outline-offset:3px}
.qtile.live::before{content:"กำลังเล่น";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-size:.68rem;font-weight:500;padding:1px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 var(--orange-edge)}
.qtile.secret{grid-column:1/-1;aspect-ratio:auto;min-height:74px;flex-direction:row;gap:14px;color:#fff;
  background:var(--blue-deep) repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 14px,transparent 14px 28px);box-shadow:0 6px 0 var(--blue-edge)}
.qtile.secret .lk{width:46px;height:46px;flex:none;border-radius:13px;background:var(--orange);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--orange-edge)}
.qtile.secret .lk svg{width:26px;height:26px;flex:none}
.qtile.secret .st{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:0}
.qtile.secret .st b{font-size:clamp(1rem,1.8vw,1.25rem);font-weight:600}
.qtile.secret .st span{font-family:var(--body);font-size:.82rem;opacity:.85}
.qtile.secret .qs{color:var(--orange);font-size:1.6rem;font-weight:600;letter-spacing:.25em}
.qtile.secret.done{background:color-mix(in srgb,var(--t-idea) 14%,#fff);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--t-idea) 38%,var(--edge))}
.qtile.secret.done .lk{background:var(--t-idea);color:#3a2500;box-shadow:0 3px 0 #b37a0b}
.qtile.secret.done .st span{color:var(--muted);opacity:1}
.ptsrule{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;background:var(--orange-soft);border-radius:12px;padding:8px 12px;font:600 1.05rem var(--display);color:#c25a0c}
.ptsrule i{font-style:normal;font:500 .78rem var(--display);background:var(--orange);color:#fff;border-radius:999px;padding:2px 10px}
.ptsrule.sm{display:inline-flex;margin-top:6px;font-size:.95rem;padding:5px 10px}
.ptsrule.sm[hidden]{display:none}
.qtext .ptsrule{width:100%}
.menuwrap{position:relative}
.ib.open{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-edge)}
.ib.open::after{display:none}
.menu{position:absolute;top:calc(100% + 12px);right:0;z-index:25;min-width:230px;background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;
  box-shadow:0 8px 0 var(--edge),0 18px 40px rgba(18,48,84,.18);animation:popin .2s ease}
.menu[hidden]{display:none}
.menu .mhead{font:500 .75rem var(--display);color:var(--muted);padding:4px 12px 6px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.mitem{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;font:500 1rem var(--display);color:var(--ink);cursor:pointer;text-align:left;width:100%}
.mitem svg{width:20px;height:20px;color:var(--blue);flex:none}
.mitem:hover,.mitem:focus-visible{background:var(--soft);outline:none}
.mitem.danger,.mitem.danger svg{color:var(--danger)}
.mitem.danger:hover,.mitem.danger:focus-visible{background:#fdeee7}
.ib.hot{background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-edge)}
.ib.hot:hover{background:#e86c12}
.ib.hot:active{box-shadow:0 1px 0 var(--orange-edge)}
.sctools{gap:12px}
.mitem.primary{font-weight:600;color:var(--blue-deep)}
/* answer reveal */
.ans .cover{transition:transform .45s cubic-bezier(.6,-.2,.7,0),opacity .45s}
.ans .cover.going{animation:shakeX .14s linear infinite;background:var(--orange) repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 12px,transparent 12px 24px)}
.ans .cover.gone{animation:none;transform:translateY(-110%) rotate(-3deg);opacity:0}
.ans{overflow:hidden}
.ans.revealed{animation:revealPop .6s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 4px var(--orange-soft),0 0 30px rgba(244,123,32,.35);background:#fff}
.ans.revealed>span:not(.k){font-family:var(--display);font-weight:600;color:var(--blue-deep);font-size:1.35rem}
@keyframes shakeX{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes revealPop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:none}}
.sa.show{animation:revealPop .5s cubic-bezier(.2,1.4,.4,1) both}
.prizeedit{display:flex;align-items:center;gap:10px;background:var(--orange-soft);border-radius:14px;padding:6px 6px 6px 12px}
.prizeedit span{color:var(--orange);display:grid;place-items:center}
.prizeedit span svg{width:22px;height:22px}
.prizeedit input{background:#fff;border:2px solid transparent;font-size:1.05rem}
.prizeedit input:focus{border-color:var(--orange);outline:none}
/* slot machine card draw */
.slotm{width:min(460px,100%);background:#fff;border:4px solid #fff;border-radius:30px;padding:22px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;
  box-shadow:0 12px 0 var(--edge),0 30px 70px rgba(18,48,84,.35);animation:popin .35s cubic-bezier(.2,1.4,.4,1)}
.slot-top{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display)}
.slot-top b{font-size:1.35rem;color:var(--blue-deep)}
.slot-tag{background:var(--orange);color:#fff;font:600 .9rem var(--display);padding:3px 14px;border-radius:999px;box-shadow:0 3px 0 var(--orange-edge)}
.slot-win{position:relative;width:100%;height:170px;overflow:hidden;border-radius:22px;background:var(--blue-deep);box-shadow:inset 0 0 0 6px var(--blue),inset 0 10px 24px rgba(0,0,0,.35)}
.slot-win::before,.slot-win::after{content:"";position:absolute;left:0;right:0;height:42px;z-index:2;pointer-events:none}
.slot-win::before{top:0;background:linear-gradient(var(--blue-deep),transparent)}
.slot-win::after{bottom:0;background:linear-gradient(transparent,var(--blue-deep))}
.slot-line{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;z-index:3;background:var(--orange);transform:rotate(45deg);box-shadow:0 0 10px rgba(244,123,32,.8)}
.slot-line.l{left:-7px}.slot-line.r{right:-7px}
.reel{will-change:transform}
.ri{height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff}
.ri .ico{width:72px;height:72px;color:#fff;background:var(--c);border-radius:20px;padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.ri .ico svg{width:100%;height:100%}
.ri b{font:600 1.7rem var(--display);color:#fff}
.slotm.spinning .reel{filter:blur(1.2px)}
.slotm.landed .slot-win{box-shadow:inset 0 0 0 6px var(--orange),0 0 0 6px var(--orange-soft),0 0 40px rgba(244,123,32,.55)}
.slotm.landed .reel>.ri:last-child{animation:pop .5s ease}
.slot-go{font-size:1.4rem;padding:14px 40px;border-radius:18px;pointer-events:none}
.slotm.spinning .slot-go svg{animation:spinIco .7s linear infinite}
@keyframes spinIco{to{transform:rotate(360deg)}}
.slot-go svg{width:24px;height:24px}
.slot-go.pulled{animation:none}
.slot-go:not([disabled]){animation:bob 1.2s ease-in-out infinite}
.slot-go[disabled]{opacity:.85;cursor:default}
.slot-hint{margin:0;color:var(--muted);font:500 .85rem var(--display)}
/* demo mode */
.demobar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;width:min(980px,calc(100% - 32px));
  background:var(--blue-deep);color:#fff;border-radius:22px;padding:14px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;
  box-shadow:0 8px 0 var(--blue-edge),0 24px 50px rgba(18,48,84,.45);animation:popin .3s ease;overflow:hidden}
.demobar .dtag{grid-column:1/-1;display:inline-flex;align-items:center;gap:6px;font:500 .8rem var(--display);color:#ffd2a8}
.demobar .dtag svg{width:16px;height:16px}
.demobar .dmain{min-width:0}
.demobar .dstep{font:500 .8rem var(--display);opacity:.75}
.demobar .dtext{margin:2px 0 0;font:500 clamp(1.05rem,1.8vw,1.35rem)/1.4 var(--display)}
.demobar .dtext b{color:#ffd2a8}
.demobar .dnote{font-size:.85em;opacity:.75}
.demobar .dbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.demobar .btn{padding:8px 14px;font-size:.95rem}
.demobar .btn:not(.go){background:rgba(255,255,255,.14);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.demobar .btn.go{background:var(--orange);box-shadow:0 4px 0 var(--orange-edge)}
.demobar .vnote{grid-column:1/-1;color:#ffd2a8}
.demobar .vnote[hidden]{display:none}
.demobar .btn svg{width:18px;height:18px}
.demobar .dprog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12)}
.demobar .dprog i{display:block;height:100%;background:var(--orange);transition:width .4s}
@media (max-width:700px){.demobar{grid-template-columns:1fr}.demobar .dbtns{justify-content:flex-start}}
.demo-hl{outline:4px solid var(--orange)!important;outline-offset:4px;animation:demoPulse .9s ease-in-out infinite!important;position:relative;z-index:5}
@keyframes demoPulse{50%{outline-color:rgba(244,123,32,.35);outline-offset:9px}}
body.demo .ibar .ib:not(#demoBtn){opacity:.35;pointer-events:none}
.btn.hot svg,.btn svg{flex:none}
/* opening splash */
body.intro-on{overflow:hidden}
.intro{position:fixed;inset:0;z-index:80;overflow:hidden;display:grid;place-items:center;color:#fff;text-align:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(1200px 600px at 50% 30%,#2f86e8 0%,#1a5fbd 45%,#0e3f80 100%)}
.intro.out{animation:introOut .75s cubic-bezier(.6,0,.4,1) forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.15);filter:blur(6px)}}
.i-spark i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:0;animation:twinkle 2.7s ease-in-out infinite}
@keyframes twinkle{40%{opacity:.75;transform:scale(1)}0%,100%{opacity:0;transform:scale(.4)}}
.i-road{position:absolute;left:50%;bottom:0;width:180vw;height:34vh;transform:translateX(-50%);background:#173452;clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);opacity:.9}
.i-road i{position:absolute;left:50%;top:0;bottom:0;width:1.6vw;transform:translateX(-50%);background:repeating-linear-gradient(to bottom,#f5c518 0 26px,transparent 26px 60px);animation:roadRun .5s linear infinite;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
@keyframes roadRun{to{background-position:0 60px}}
.i-car{position:absolute;bottom:4vh;width:clamp(90px,10vw,150px);left:-15%;animation:carDrive 2.6s .3s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes carDrive{to{left:calc(50% - clamp(45px,5vw,75px))}}
.intro.ready .i-car{animation:carDrive 2.6s .3s cubic-bezier(.3,.7,.3,1) forwards,bob 1s ease-in-out infinite}
.i-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:20vh}
.i-eye{font:500 clamp(.9rem,1.6vw,1.2rem) var(--display);background:var(--orange);padding:4px 18px;border-radius:999px;box-shadow:0 4px 0 var(--orange-edge);opacity:0;animation:fadeUp .6s .1s ease forwards}
.i-title{margin:0;display:flex;flex-direction:column;align-items:center;line-height:.95;font-family:var(--display);font-weight:600;color:#fff;text-shadow:none}
.i-road-t{font-size:clamp(2.4rem,7vw,5.5rem);text-shadow:0 6px 0 rgba(0,0,0,.18);opacity:0;animation:fadeUp .6s .35s ease forwards}
.i-year{font-size:clamp(5rem,17vw,13rem);color:#ffd2a8;font-variant-numeric:tabular-nums;text-shadow:0 8px 0 var(--orange-edge),0 0 40px rgba(244,123,32,.4);opacity:0;animation:fadeUp .6s .6s ease forwards}
.thname{font-size:.42em;margin-left:.35em;color:var(--orange);font-weight:500;letter-spacing:0;text-shadow:none;vertical-align:.15em}
.i-th{display:block;font:600 clamp(1.8rem,5vw,3.6rem) var(--display);color:#ffd2a8;margin-top:6px;opacity:0;text-shadow:0 4px 0 var(--orange-edge);animation:letterIn .6s 1.45s cubic-bezier(.2,1.6,.4,1) forwards}
.i-thai{line-height:1.3;padding-top:.08em;letter-spacing:.01em}
.i-en{font-family:var(--display);font-weight:600;letter-spacing:.06em;color:#fff;font-size:clamp(1.6rem,4.2vw,3rem);margin-top:-.15em;text-shadow:0 3px 0 var(--orange-edge)}
.i-word span{display:inline-block;opacity:0;animation:letterIn .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes letterIn{from{opacity:0;transform:translateY(-60px) rotate(-12deg) scale(.6)}to{opacity:1;transform:none}}
.i-year.hit{animation:yearHit .6s cubic-bezier(.2,1.6,.4,1) forwards;color:#fff;text-shadow:0 8px 0 var(--orange-edge),0 0 60px rgba(255,210,168,.9)}
@keyframes yearHit{0%{transform:scale(1);opacity:1}40%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.i-sub{margin:0;font:500 clamp(1rem,2vw,1.4rem) var(--display);opacity:0;transition:opacity .5s}
.i-go{font-size:clamp(1.3rem,2.4vw,1.8rem);padding:16px 44px;border-radius:20px;opacity:0;transform:scale(.8);transition:opacity .4s,transform .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.i-go svg{width:28px;height:28px}
.i-hint{font:500 .85rem var(--display);opacity:0;transition:opacity .5s}
.intro.ready .i-sub,.intro.ready .i-hint{opacity:.85}
.intro.ready .i-go{opacity:1;transform:none;pointer-events:auto;animation:bob 1.2s .4s ease-in-out infinite}
.i-skip{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:3;border:0;background:rgba(255,255,255,.16);color:#fff;font:500 .95rem var(--display);padding:8px 16px;border-radius:12px;cursor:pointer}
.i-skip:hover{background:rgba(255,255,255,.28)}
.board.enter .tile{animation:tileIn .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0)*60ms)}

.pinrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.pin input{width:13rem;max-width:100%;text-align:center;font-size:1.3rem;letter-spacing:.3em;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.pin input:focus{border-color:var(--blue);outline:none}
.pin input.bad{border-color:var(--danger);animation:shake .4s ease}
.qrpage{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:12px 14px}
.qrpage b{display:block;font:600 1.05rem var(--display);color:var(--blue-deep)}
.qrpage code{font-size:.8rem;color:var(--muted);word-break:break-all}
.qrpage .btn{text-decoration:none;padding:8px 14px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.lk.big{background:var(--surface);border:0;box-shadow:0 7px 0 var(--edge);border-radius:20px;padding:18px}
.lk.big b{font-size:1.6rem}
.lk.big .qr{width:min(100%,300px)}
.tv .top .btn{text-decoration:none}
/* board + side scoreboard */
.main{grid-template-columns:minmax(0,1fr) clamp(250px,21vw,340px)}
@media (max-width:1020px){.main{grid-template-columns:1fr}}
.board{gap:clamp(10px,1.3vw,18px)}
.tile{aspect-ratio:1/0.82;border-radius:24px}
.tile .ex{font-size:clamp(.9rem,1.4vw,1.2rem)}
.tile .num{font-size:clamp(3rem,6.4vw,6.6rem);text-shadow:0 6px 0 var(--soft)}
.tile:not(.done):not(.secret)::after{width:clamp(28px,2.8vw,42px);height:clamp(28px,2.8vw,42px);font-size:clamp(1rem,1.6vw,1.4rem);top:10px;right:10px}
.tile.done .num{font-size:clamp(.95rem,1.4vw,1.2rem)}
.tile.done .ico{width:clamp(36px,4.4vw,68px);height:clamp(36px,4.4vw,68px)}
.tile.done .tl{font-size:clamp(1.05rem,1.8vw,1.5rem)}
.tile.done .by{font-size:clamp(.8rem,1.1vw,1rem)}
.tile.secret{min-height:clamp(96px,10vw,140px)}
.tile.secret .lock{width:clamp(50px,5vw,72px);height:clamp(50px,5vw,72px)}
.tile.secret .lock svg{width:60%;height:60%}
.tile.secret .st b{font-size:clamp(1.3rem,2.6vw,2.2rem)}
.tile.secret .st span{font-size:clamp(.85rem,1.2vw,1.1rem)}
.tile.secret .qs{font-size:clamp(1.6rem,3.4vw,3rem)}
.panel .lanes{display:grid;grid-template-columns:1fr;gap:12px}
@media (max-width:1020px){.panel .lanes{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.panel .lane{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm sc" "tr tr" "bb bb";gap:8px 10px;background:var(--bg);border-radius:18px;padding:12px 14px;align-content:center}
.panel .lane.lead{background:var(--orange-soft)}
.panel .lane .nm{grid-area:nm;font-size:1.15rem}
.panel .lane .tr{grid-area:tr}
.panel .lane .sc{grid-area:sc;font-size:clamp(1.8rem,2.6vw,2.6rem);line-height:1}
.panel .lane .bb{grid-area:bb;justify-content:flex-end}
.panel .lane .bb:empty{display:none}
.panel .lane .av{width:30px;height:30px;font-size:.95rem}
.panel .pop{right:14px;top:-12px;font-size:1.6rem}
.road .mk.on{background:var(--c,var(--blue));box-shadow:0 0 0 2px var(--c,var(--blue))}
.road .mk.empty{color:transparent}
@media (max-width:640px){.tile .num{font-size:clamp(3rem,16vw,4.5rem)}}

/* fit everything on one screen (projector / full screen) */
@media (min-width:1021px){
  html:has(body.host),body.host{height:100%}
  html:has(body.host){overflow:hidden}
  body.host{overflow:hidden;padding-block:clamp(10px,1.6vh,18px)}
  body.host #hostView{height:100%;max-width:none;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:clamp(8px,1.4vh,16px)}
  body.host .road{height:clamp(46px,6vh,62px)}
  body.host .main{min-height:0;height:100%;align-items:stretch}
  body.host .board{min-height:0;height:100%;grid-template-rows:repeat(var(--rows,2),minmax(0,1fr)) minmax(70px,calc(.72fr / var(--rows,2)));padding-bottom:10px}
  body.host .tile{aspect-ratio:auto;height:100%;min-height:0}
  body.host .tile .num{font-size:clamp(2.2rem,min(calc(18vh / var(--rows,2)),calc(28vw / var(--cols,5))),7rem)}
  body.host .tile .ex{font-size:clamp(.85rem,min(2.2vh,1.3vw),1.25rem)}
  body.host .tile.done{gap:clamp(2px,.6vh,6px);padding:8px}
  body.host .tile.done .num{font-size:clamp(.8rem,min(2vh,1.2vw),1.15rem);text-shadow:none}
  body.host .tile.done .tl{font-size:clamp(.95rem,min(2.8vh,1.7vw),1.6rem)}
  body.host .tile.done .by{font-size:clamp(.75rem,min(1.8vh,1.05vw),1rem)}
  body.host .tile.done .ico{width:clamp(30px,min(7vh,4vw),72px);height:clamp(30px,min(7vh,4vw),72px)}
  body.host .tile.secret{min-height:0}
  body.host .tile.secret .lock{width:clamp(44px,8vh,72px);height:clamp(44px,8vh,72px)}
  body.host .panel{height:calc(100% - 10px);min-height:0}
  body.host .panel .lanes{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);overflow:auto}
  body.host .panel .lanes.many{grid-template-columns:1fr 1fr}
  body.host .panel .lane .sc{font-size:clamp(1.8rem,min(6vh,3vw),3.4rem)}
}

/* ================= scores (shared log) ================= */
const rowsNow=()=>useDb()?logRows:st.log;
/* totals replay the log in time order and never drop below 0 (also after undoing an earlier + row) */
function scoresFrom(rows){const s=Array(cfg.teams).fill(0);rows.slice().sort((a,b)=>(a.at||0)-(b.at||0)).forEach(r=>{if(r.undone)return;(r.changes||[]).forEach(c=>{if(c.t>=0&&c.t<s.length)s[c.t]=Math.max(0,s[c.t]+c.d)})});return s}
/* a deduction takes at most what the team has; a change that would do nothing is dropped */
function floorChanges(changes){const cur=st.scores.slice();return changes.map(c=>{const d=c.d<0?Math.max(c.d,-(cur[c.t]||0)):c.d;cur[c.t]=(cur[c.t]||0)+d;return{t:c.t,d}}).filter(c=>c.d!==0)}
const floorMsg=changes=>{const t=(changes.find(c=>c.d<0)||{}).t;return t!=null?`${tname(t)} มี 0 แต้ม หักเพิ่มไม่ได้`:"ไม่มีคะแนนที่เปลี่ยน"};
function recompute(quiet){
  const old=st.scores.slice();st.scores=scoresFrom(rowsNow());
  if(!quiet)st.scores.forEach((v,i)=>{const d=v-(old[i]||0);if(d){bumpSet.add(i);popMap[i]=(popMap[i]||0)+d}});
  saveAll();renderLanes();paintGot();pushLive();
  if(view==="score")renderScorer();
  if(logOpen)renderLogSheet();
}
const curRound=()=>view==="score"?(scLive&&scLive.card&&scLive.card.round)||"":(liveCard&&liveCard.round)||"";
let lastId=null,toastT;
/* tile name for a score row's sk ("t2" → ช่อง 3); old labels that already name it are left as they are */
const skName=sk=>/^t\d+$/.test(sk||"")?"ช่อง "+(+sk.slice(1)+1):"";
const rowLabel=r=>{const n=skName(r.sk),l=String(r.label||"");return n&&!new RegExp(n+"(?!\\d)").test(l)?`${l} (${n})`:l};
async function addScore(changes,label,extra){
  const sk=view==="score"?(scSel||""):((liveCard&&liveCard.sk)||"");
  const row=Object.assign({changes,label,at:Date.now(),undone:false,round:curRound(),sk},extra||{});
  if(useDb()){
    if(!epoch){toast("ยังเชื่อมต่อคะแนนไม่เสร็จ ลองอีกครั้ง",true);return}
    row.changes=floorChanges(changes);if(changes.length&&!row.changes.length){toast(floorMsg(changes),true);sfx("tick");return}
    sfx(row.changes.some(c=>c.d>0)?"coin":"down");
    try{const ref=await db.collection("scorelog").add(Object.assign({epoch},row));lastId=ref.id;toast(rowLabel(row))}
    catch(e){toast("บันทึกคะแนนไม่ได้ ลองอีกครั้ง",true)}
  }else{
    const id="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);let blocked=false;
    localCommit(()=>{row.changes=floorChanges(changes);if(changes.length&&!row.changes.length){blocked=true;return}st.log.push(Object.assign({id},row));if(st.log.length>400)st.log.shift()});
    if(blocked){toast(floorMsg(changes),true);sfx("tick");return}
    sfx(row.changes.some(c=>c.d>0)?"coin":"down");
    lastId=id;toast(rowLabel(row));
  }
}
/* local mode: the backstage view is not the owner of st, so reload the host's latest copy before changing the log */
function localCommit(mut){
  const away=view!=="host"&&!demo;
  if(away){const s=load(K.st);if(s){st=s;if(!Array.isArray(st.log))st.log=[];fitTeams()}}
  mut();recompute();
  if(away)store(K.st,st);
}
async function setUndone(id,val){
  if(!id)return;
  if(useDb()){try{await db.doc("scorelog/"+id).update({undone:val});sfx("down")}catch(e){toast("แก้ประวัติไม่ได้ ลองอีกครั้ง",true)}}
  else{if(view==="host"&&!st.log.some(x=>x.id===id))return;let hit=false;localCommit(()=>{const r=st.log.find(x=>x.id===id);if(r){r.undone=val;hit=true}});if(hit)sfx("down")}
}
function toast(msg,noUndo){
  $("toastMsg").textContent=msg;$("toastUndo").hidden=!!noUndo;$("toast").hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{$("toast").hidden=true},4200);
}

function roundGrid(hostScore){return `<div class="scoring"><h4>${hostScore?"ให้คะแนนรอบนี้":"คะแนนรอบนี้"}</h4><div class="sgrid">${st.scores.map((_,i)=>`<div class="sbox" id="sb${i}"><div class="sh"><span class="av">${i+1}</span><b>${esc(tname(i))}</b><span class="got" id="got${i}"></span>${hostScore?`<button class="mini" data-add="${i}" data-d="1">+1</button><button class="mini" data-add="${i}" data-d="2">+2</button><button class="mini" data-add="${i}" data-d="3">+3</button>`:""}</div></div>`).join("")}</div></div>`}

const tfTimerCard=(c,i)=>({q:`ข้อ ${i+1}/${c.items.length} · ${(c.items[i]||{}).q||""}`,how:c.how,pts:c.pts});
/* one question at a time: ◀ / ▶ move between questions, each has its own reveal */
function tfInit(c){
  let i=0;const shown=new Set();
  const render=()=>{
    const it=c.items[i]||tfItem(),N=c.items.length,hasKey=it.correct==="A"||it.correct==="B",done=shown.has(i);
    $("tfQ").innerHTML=`<div class="tfnav"><span class="tfno">ข้อ ${i+1} / ${N}</span><span class="tft">${rich(c.q)}</span></div><h3 class="q" id="cq">${rich(it.q||"[พิมพ์คำถาม]")}</h3>${c.how?`<p class="how">${rich(c.how)}</p>`:""}<span class="pts">${rich(c.pts)}</span>`;
    const panel=L=>`<div class="abpanel ab${L}${it.correct===L?" is-correct":""}" data-l="${L}"><div class="abtop"><span class="abL">${L}</span><span class="abok">✓ ถูกต้อง</span></div><div class="abtxt">${rich(it["opt"+L]||"[ตัวเลือก "+L+"]")}</div></div>`;
    $("tfItem").innerHTML=`<div class="abstage${done?" show":""}" id="tfStage">${panel("A")}<div class="abvs" aria-hidden="true">หรือ</div>${panel("B")}</div>
      <div class="abctrl"><button class="btn" id="tfPrev"${i===0?" disabled":""}>◀ ข้อก่อนหน้า</button><span class="spacer"></span>${done?`<button class="btn hot" disabled>เฉลยแล้ว · ข้อ ${it.correct}</button>`:hasKey?`<button class="btn hot" id="tfCover">แตะเพื่อเฉลย</button>`:`<button class="btn hot" id="tfPick">เลือกข้อที่ถูก</button>`}<button class="btn go" id="tfNext"${i>=N-1?" disabled":""}>ข้อต่อไป ▶</button></div>`;
    const stg=$("tfStage");
    const reveal=btn=>{btn.disabled=true;btn.textContent="คำตอบคือ…";sfx("drum");setTimeout(()=>{if(!stg.isConnected)return;shown.add(i);stg.classList.add("show");btn.textContent="เฉลยแล้ว · ข้อ "+c.items[i].correct;sfx("reveal")},reduced()?0:850)};
    const cov=$("tfCover");if(cov)cov.onclick=()=>reveal(cov);
    const pk=$("tfPick");
    if(pk){
      pk.onclick=()=>{const on=!stg.classList.contains("picking");stg.classList.toggle("picking",on);pk.textContent=on?"แตะช่องที่ถูกด้านบน · ยกเลิก":"เลือกข้อที่ถูก";if(on)sfx("tick")};
      stg.onclick=e=>{if(!stg.classList.contains("picking"))return;const p=e.target.closest(".abpanel");if(!p)return;const L=p.dataset.l;
        stg.classList.remove("picking");c.items[i].correct=L;saveAll();
        stg.querySelectorAll(".abpanel").forEach(x=>x.classList.toggle("is-correct",x.dataset.l===L));reveal(pk)};
    }
    const go=d=>{i=Math.max(0,Math.min(c.items.length-1,i+d));render();sfx("tick");if(c.sec>0){setupTimer(c.sec,tfTimerCard(c,i));setLiveTimer(false)}};
    $("tfPrev").onclick=()=>go(-1);$("tfNext").onclick=()=>go(1);
  };
  render();
}
function cardHTML(c,opts){
  const t=TYPES[c.type]||TYPES.compass,hostScore=!useDb();

    ?`<div class="timer"><button class="tbig" id="tOpen" aria-label="เปิดหน้าจับเวลา">${UI.clock}<span class="mc" id="miniClock">${fmt(c.sec)}</span><span class="ml" id="miniLbl">กดเพื่อจับเวลา</span></button></div>`
    :`<div class="notime">ช่องนี้ไม่ต้องจับเวลา<br>ทำตามการ์ดได้เลย</div>`;
  const ansText=c.ans||abAns(c);
  const ansKey=ansText?`<div class="ans"><span class="k">เฉลย</span><span>${rich(ansText)}</span><button class="cover" id="ansCover">แตะเพื่อเฉลย</button></div>`:"";

    <div class="band"><span class="ico">${ICON[c.type]}</span><div><div class="bt">${esc(opts.label||t.label)}</div><div class="bo">${esc(opts.sub||t.obj)}</div></div><button class="x" data-close>ปิดการ์ด</button></div>
    <div class="cbody"><div class="qcol"><div class="qrow"><h3 class="q" id="cq">${rich(c.q)}</h3><span class="pts">${rich(c.pts)}</span></div><p class="how">${rich(c.how)}</p>${ansKey}</div>${side}${bottom}</div></div>`;
}
function showCard(c,opts){
  openOv(cardHTML(c,opts));
  const ov=$("ov");
  ov.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const t=+b.dataset.add,d=+b.dataset.d;addScore([{t,d}],`${tname(t)} +${d}`)});
  const cov=$("ansCover");if(cov)cov.onclick=()=>{
    if(cov.classList.contains("going"))return;
    cov.classList.add("going");cov.textContent="คำตอบคือ…";sfx("drum");
    setTimeout(()=>{cov.classList.add("gone");const box=cov.closest(".ans");box&&box.classList.add("revealed");const ab=document.querySelector(".card .abopts");ab&&ab.classList.add("show");const stg=$("abStage");if(stg){stg.classList.add("show");cov.textContent="เฉลยแล้ว · ข้อ "+corrText(c);cov.disabled=true;sfx("reveal");return}sfx("reveal");setTimeout(()=>cov.remove(),450)},reduced()?0:850);
  };
  const pk=$("abPick"),stg0=$("abStage");
  if(pk&&stg0){
    const multi=c.mode==="abcd",picked=new Set();
    const pickLbl=()=>picked.size?`ยืนยันเฉลย · ข้อ ${LETS(c).filter(L=>picked.has(L)).join(", ")}`:"แตะช่องที่ถูกด้านบน (เลือกได้หลายข้อ) · ยกเลิก";
    const commit=set=>{
      const val=corrStr(c,set);stg0.classList.remove("picking");pk.disabled=true;pk.textContent="คำตอบคือ…";sfx("drum");
      const sk=liveCard&&liveCard.sk,src=sk?cards.tiles[+sk.slice(1)]:null;
      if(src){src.correct=val;saveAll()}c.correct=val;if(liveCard){liveCard.correct=val;pushLive(true)}
      stg0.querySelectorAll(".abpanel").forEach(x=>{x.classList.remove("sel");x.classList.toggle("is-correct",set.has(x.dataset.l))});
      setTimeout(()=>{stg0.classList.add("show");pk.textContent="เฉลยแล้ว · ข้อ "+val.split("").join(", ");sfx("reveal")},reduced()?0:850);
    };
    pk.onclick=()=>{
      if(multi&&stg0.classList.contains("picking")&&picked.size){commit(picked);return}
      const on=!stg0.classList.contains("picking");stg0.classList.toggle("picking",on);
      pk.textContent=on?(multi?pickLbl():"แตะช่องที่ถูกด้านบน · ยกเลิก"):"เลือกข้อที่ถูก";if(on)sfx("tick");
    };
    stg0.addEventListener("click",e=>{
      if(!stg0.classList.contains("picking"))return;const p=e.target.closest(".abpanel");if(!p)return;const L=p.dataset.l;
      if(!multi){commit(new Set([L]));return}
      if(picked.has(L))picked.delete(L);else picked.add(L);
      p.classList.toggle("sel",picked.has(L));pk.textContent=pickLbl();sfx("tick");
    });
  }
  const lb=$("luckBox");if(lb)lb.onclick=e=>{
    const o=e.target.closest("[data-lowner]"),x=e.target.closest("[data-target]");
    if(o){const p=+o.dataset.lowner;lb.dataset.p=p;lb.innerHTML=luckTargetHTML(c.luck,p,"data-target","data-lback");return}
    const back=()=>{delete lb.dataset.p;lb.innerHTML=luckOwnerHTML("data-lowner",liveCard&&liveCard.sk)};
    if(x){applyLuck(c.luck,+lb.dataset.p,+x.dataset.target,liveCard&&liveCard.sk);back();return}
    if(e.target.closest("[data-lback]"))back();
  };
  startRound(c,opts);
  if(c.type==="luck")tfInit(c);
  if(c.sec>0)setupTimer(c.sec,c.type==="luck"?tfTimerCard(c,0):c);
  paintGot();
}
const luckVerb=k=>k==="steal"?"ขโมย 2 แต้มจากทีมไหน":"ยก 1 แต้มให้ทีมไหน";
/* a luck card can go to several teams; each team uses it once per tile (sk), also after the card is closed and reopened.
   Undo in the score log frees the team again. */
let luckPending={sk:null,set:new Set()};
const luckOwnerOf=r=>r.owner!=null?r.owner:((r.changes||[])[0]||{}).t;
function luckUsed(sk){
  const used=new Map();if(!sk)return used;
  const rows=rowsNow().filter(r=>r.kind==="luck"&&r.sk===sk);
  rows.forEach(r=>{if(!r.undone)used.set(luckOwnerOf(r),r.label)});
  if(luckPending.sk===sk)luckPending.set.forEach(p=>{if(rows.some(r=>luckOwnerOf(r)===p))luckPending.set.delete(p);else if(!used.has(p))used.set(p,"")});
  return used;
}
function luckOwnerHTML(attr,sk){
  const used=luckUsed(sk),labels=[...used.values()].filter(Boolean);
  return `<h4>การ์ดดวง · ${used.size?"เลือกทีมอื่นที่ได้การ์ดนี้ต่อได้":"ทีมไหนได้การ์ดนี้?"}</h4><div class="pick">${st.scores.map((_,i)=>used.has(i)?`<button class="mini" disabled title="ใช้การ์ดนี้แล้ว">✓ ${esc(tname(i))}</button>`:`<button class="mini" ${attr}="${i}">${esc(tname(i))}</button>`).join("")}</div>${labels.length?`<p class="hint">ใช้แล้ว: ${labels.map(esc).join(" · ")}</p>`:""}`}
function luckTargetHTML(kind,p,attr,backAttr){return `<h4>${esc(tname(p))} ได้การ์ดนี้ · ${luckVerb(kind)}</h4><div class="pick">${st.scores.map((s,i)=>i===p?"":`<button class="mini" ${attr}="${i}">${esc(tname(i))}${kind==="steal"?` (${s} แต้ม)`:""}</button>`).join("")}<button class="mini" ${backAttr} title="กลับไปเลือกทีมที่ได้การ์ด">↩ เปลี่ยนทีม</button></div>`}
/* steal takes up to 2 points, never more than the target has, so no team goes below 0 */
function applyLuck(kind,p,x,sk){
  if(sk){if(luckPending.sk!==sk)luckPending={sk,set:new Set()};luckPending.set.add(p)}
  const meta=Object.assign({kind:"luck",owner:p},sk?{sk}:{});
  if(kind==="steal"){
    const n=Math.max(0,Math.min(2,st.scores[x]||0));
    addScore(n?[{t:p,d:n},{t:x,d:-n}]:[],n?`${tname(p)} ขโมย ${n} แต้มจาก ${tname(x)}${n<2?` · ${tname(x)} มีแค่ ${n} แต้ม`:""}`:`${tname(p)} ขโมยจาก ${tname(x)} ไม่ได้ · ${tname(x)} ไม่มีแต้ม`,meta);
    return;
  }
  addScore([{t:p,d:2},{t:x,d:1}],`${tname(p)} +2 และแบ่ง +1 ให้ ${tname(x)}`,meta);
}
function roundGot(round){const g=Array(cfg.teams).fill(0);if(!round)return g;rowsNow().forEach(r=>{if(r.undone||r.round!==round)return;(r.changes||[]).forEach(c=>{if(c.t<g.length)g[c.t]+=c.d})});return g}
function paintGot(){
  if(!liveCard)return;const g=roundGot(liveCard.round);
  const lb=$("luckBox");if(lb&&lb.dataset.p==null)lb.innerHTML=luckOwnerHTML("data-lowner",liveCard.sk);
  g.forEach((v,i)=>{const el=$("got"+i),b=$("sb"+i);if(!el)return;el.textContent=v?(v>0?"+":"")+v:"";b.classList.toggle("hit",v!==0)});
}

/* ================= timer ================= */
function stopTimer(){clearInterval(timer);timer=null;clearTimeout(cdT);cdT=null}
function drawTimer(){
  const mc=$("miniClock"),ml=$("miniLbl"),tb=$("tOpen");
  if(mc){mc.textContent=left<=0?"หมดเวลา":fmt(left);ml.textContent=timer?"กำลังจับเวลา · แตะเพื่อดู":left<=0?"แตะเพื่อเริ่มใหม่":left<total?"หยุดไว้ · แตะเพื่อดู":"กดเพื่อจับเวลา";
    tb.classList.toggle("run",!!timer);tb.classList.toggle("low",left>0&&left<=10);tb.classList.toggle("end",left<=0)}
  const fg=$("ringFg"),ring=$("ring"),clock=$("clock");if(!fg)return;
  fg.style.strokeDashoffset=326.7*(1-left/total);
  ring.classList.toggle("low",left>0&&left<=10);ring.classList.toggle("end",left<=0);
  if(!cdT)clock.textContent=left<=0?"หมดเวลา!":fmt(left);
}
function openTimer(){$("tov").hidden=false;const b=$("tStart");b&&b.focus()}
function hideTimer(){$("tov").hidden=true}
function setupTimer(sec,c){
  $("tov").innerHTML=`<div class="tbox" role="dialog" aria-modal="true" aria-label="จับเวลา">
    <div class="thead"><div class="tq">${rich(c.q)}${c.how?`<p class="tdesc"><b>วิธีเล่น</b>${rich(c.how)}</p>`:""}</div><span class="pts">${rich(c.pts)}</span><button class="btn" id="tHide">ย่อหน้าต่าง</button></div>
    <div class="ring big" id="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="12"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="tt" id="clock">${fmt(sec)}</div></div>
    <div class="trow"><button class="btn go big" id="tStart">เริ่มจับเวลา</button><button class="btn" id="tAdd">+30 วิ</button><button class="btn" id="tReset">รีเซ็ต</button></div></div>`;
  $("tHide").onclick=hideTimer;
  $("tov").onclick=e=>{if(e.target.id==="tov")hideTimer()};
  $("tOpen").onclick=openTimer;
  total=sec;left=sec;stopTimer();drawTimer();
  const run=()=>{
    setLiveTimer(true);sfx("go");$("tStart").textContent="หยุดชั่วคราว";
    timer=setInterval(()=>{left--;drawTimer();
      if(left===30&&total>=60){sfx("warn30");toast("เหลือเวลา 30 วินาที",true)}
      else if(left===10)sfx("warn10");
      else if(left>5&&left<10)sfx("tickLow");
      else if(left>0&&left<=5)sfx("tick");
      if(left<=0){stopTimer();sfx("end");$("tStart").textContent="เริ่มใหม่";setLiveTimer(false);openTimer();drawTimer()}},1000);
  };
  $("tStart").onclick=()=>{
    if(cdT)return;
    if(timer){stopTimer();$("tStart").textContent="เดินต่อ";setLiveTimer(false);drawTimer();return}
    if(left<=0)left=total;
    if(left===total&&!reduced()){
      const seq=["3","2","1","เริ่ม!"];let k=0;
      const step=()=>{const clock=$("clock");if(!clock){cdT=null;return}
        clock.textContent=seq[k];clock.classList.remove("cd");void clock.offsetWidth;clock.classList.add("cd");
        if(k<3)sfx("cd");k++;
        cdT=setTimeout(k<seq.length?step:()=>{cdT=null;clock.classList.remove("cd");drawTimer();run()},k<seq.length?1000:700)};
      step();
    }else run();
  };
  $("tAdd").onclick=()=>{left+=30;total=Math.max(total,left);drawTimer();setLiveTimer(!!timer)};
  $("tReset").onclick=()=>{stopTimer();total=sec;left=sec;drawTimer();$("tStart").textContent="เริ่มจับเวลา";setLiveTimer(false)};
}

/* ================= board clicks + spin ================= */
$("board").addEventListener("click",e=>{
  const b=e.target.closest(".tile");if(!b)return;
  const i=+b.dataset.i,fresh=!st.opened.includes(i);
  if(fresh){
    const nx=nextTile();
    if(i!==nx){toast(`เปิดตามลำดับ · ช่องถัดไปคือช่อง ${nx+1}`,true);sfx("tick");const n=document.querySelector(`.tile[data-i="${nx}"]`);if(n){n.classList.remove("nudge");void n.offsetWidth;n.classList.add("nudge")}return}
    st.opened.push(i);
    saveAll();renderBoard();renderRoad();pushBoard();
  }
  const go=()=>showCard(cards.tiles[i],{idx:i,sub:`ช่อง ${i+1} · `+(TYPES[cards.tiles[i].type]||TYPES.compass).obj});
  if(fresh)spinThen(cards.tiles[i].type,go,"ช่อง "+(i+1));else go();
});
function spinThen(type,done,label){
  if(reduced()){sfx(type?"open":"secret");done();return}
  const tok=++spinTok,keys=Object.keys(TYPES),H=170,K=type?34:30;
  const item=k=>{
    if(k==="lock")return `<div class="ri" style="--c:var(--blue-deep)"><span class="ico">${UI.lock}</span><b>???</b></div>`;
    if(k==="final")return `<div class="ri" style="--c:var(--t-idea)"><span class="ico">${ICON.idea}</span><b>รอบสุดท้าย!</b></div>`;
    const t=TYPES[k];return `<div class="ri" style="--c:${t.c}"><span class="ico">${ICON[k]}</span><b>${t.label}</b></div>`;
  };
  const seq=[];for(let j=0;j<K-1;j++)seq.push(type?keys[(j*3+Math.floor(Math.random()*keys.length))%keys.length]:(j%2?"lock":keys[j%keys.length]));
  seq.push(type||"final");
  openOv(`<div class="slotm" role="dialog" aria-modal="true" aria-labelledby="slotT">
    <div class="slot-top"><span class="slot-tag">${esc(label||"")}</span><b id="slotT">${type?"ลุ้นประเภทการ์ด":"ปลดล็อกด่านลับ"}</b></div>
    <div class="slot-win"><div class="reel" id="reel">${seq.map(item).join("")}</div><i class="slot-line l"></i><i class="slot-line r"></i></div>
    <button class="btn hot slot-go pulled" id="slotGo" tabindex="-1">${UI.reset}กำลังหมุน…</button></div>`);
  const reel=$("reel"),go=$("slotGo");
  go.onclick=()=>{
    if(go.disabled)return;go.disabled=true;go.classList.add("pulled");go.lastChild.textContent="กำลังหมุน…";
    const dur=type?2600:3000,dist=(K-1)*H;let last=0,raf=0;
    $("ov").querySelector(".slotm").classList.add("spinning");
    reel.style.transition=`transform ${dur}ms cubic-bezier(.12,.62,.18,1)`;
    requestAnimationFrame(()=>{reel.style.transform=`translateY(-${dist}px)`});
    const tick=()=>{if(tok!==spinTok)return;const y=new DOMMatrix(getComputedStyle(reel).transform).m42,idx=Math.round(-y/H);
      if(idx!==last){last=idx;tone(300+Math.min(idx,K)*22,0,.04,"square")}raf=requestAnimationFrame(tick)};
    raf=requestAnimationFrame(tick);
    spinT=setTimeout(()=>{
      cancelAnimationFrame(raf);if(tok!==spinTok)return;

let confRAF=null;
function confetti(){
  if(reduced())return;
  const cv=$("confetti"),ctx=cv.getContext("2d");cv.hidden=false;
  const W=cv.width=innerWidth,H=cv.height=innerHeight,cols=["#1f6fd1","#f47b20","#2ea3dc","#ffb36b","#9cc8f5","#124f9e"];
  const ps=Array.from({length:180},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(t-t0<5000)confRAF=requestAnimationFrame(f);else stopConfetti()})(t0);
}
function stopConfetti(){cancelAnimationFrame(confRAF);$("confetti").hidden=true}

function demoBar(html){let b=$("demoBar");if(!b){b=document.createElement("div");b.id="demoBar";b.className="demobar";document.body.appendChild(b)}b.innerHTML=html;return b}
function demoSay(step,total,text,spoken){
  demoBar(`<span class="dtag">${UI.play}โหมดสาธิต · ไม่มีผลกับคะแนนจริง</span>
    <div class="dmain"><span class="dstep">ขั้นที่ ${step}/${total}</span><p class="dtext">${text}</p></div>
    <div class="dbtns"><button class="btn" id="demoVoice" aria-pressed="${narrate}">${narrate?UI.on:UI.off}เสียงพากย์</button><button class="btn" id="demoPause">${demoPaused?"เล่นต่อ":"หยุดชั่วคราว"}</button><button class="btn" id="demoNext">ข้าม ›</button><button class="btn go" id="demoExit">ออกจากสาธิต</button></div>
    <span class="dnote vnote" id="demoVoiceNote"${thVoice||!narrate?" hidden":""}>เครื่องนี้ไม่มีเสียงภาษาไทย · แนะนำเปิดด้วย Microsoft Edge หรือติดตั้งเสียงภาษาไทยในเครื่อง</span>
    <div class="dprog"><i style="width:${Math.round(step/total*100)}%"></i></div>`);
  $("demoVoice").onclick=()=>{narrate=!narrate;try{localStorage.setItem("r2570-narrate",narrate?"1":"0")}catch(e){}const b=$("demoVoice");b.innerHTML=(narrate?UI.on:UI.off)+"เสียงพากย์";b.setAttribute("aria-pressed",narrate);$("demoVoiceNote").hidden=!!thVoice||!narrate;if(narrate)speak(spoken||text);else stopSpeak()};
  speak(spoken||text);
  $("demoPause").onclick=()=>{demoPaused=!demoPaused;$("demoPause").textContent=demoPaused?"เล่นต่อ":"หยุดชั่วคราว";if(tts)try{demoPaused?tts.pause():tts.resume()}catch(e){}};
  $("demoNext").onclick=()=>{demoSkip=true;stopSpeak()};
  $("demoExit").onclick=()=>{nav("host")};
}
async function dWait(ms,tok){
  const end=Date.now()+ms;demoSkip=false;
  while(true){if(tok!==demoTok)throw "abort";if(demoSkip){demoSkip=false;return}
    if(demoPaused){await new Promise(r=>setTimeout(r,120));continue}
    if(Date.now()>=end&&!speaking())return;await new Promise(r=>setTimeout(r,80))}
}
async function dUntil(fn,ms,tok){const end=Date.now()+ms;while(Date.now()<end){if(tok!==demoTok)throw "abort";if(fn())return true;await new Promise(r=>setTimeout(r,100))}return false}
async function dTap(el,tok){if(!el)return;el.classList.add("demo-hl");await dWait(900,tok);el.classList.remove("demo-hl");if(tok!==demoTok)throw "abort";el.click()}
function startDemo(){
  if(!demo){
    demoSaved={st:clone(st),cfg:clone(cfg),cards:clone(cards),muted};
    demo=true;
  }
  const tok=++demoTok;demoPaused=false;stopSpeak();
  closeOv();
  cfg={teams:4,names:[],prize:demoSaved.cfg.prize||""};
  cards=clone(DEMO_CARDS);st=freshState(4);bumpSet.clear();popMap={};
  document.body.classList.add("demo");
  renderAll();
  runDemo(tok).catch(e=>{if(e!=="abort")console.error(e)});
}
function exitDemo(){
  if(!demo)return;stopSpeak();
  demoTok++;demo=false;closeOv();
  st=demoSaved.st;cfg=demoSaved.cfg;cards=demoSaved.cards;demoSaved=null;
  document.body.classList.remove("demo");
  const b=$("demoBar");if(b)b.remove();
  if(useDb())st.scores=scoresFrom(rowsNow());
  renderAll();if(lastBoard)applyBoard(lastBoard);
}
async function runDemo(tok){
  const T=7,qI=Math.max(0,nextTile());
  demoSay(1,T,"นี่คือกระดานเกม · พิธีกร<b>เปิดการ์ดทีละช่องตามลำดับ</b> แล้วทุกทีมตอบคำถามข้อเดียวกันพร้อมกัน","พิธีกรเปิดการ์ดทีละช่องตามลำดับ แล้วทุกทีมตอบคำถามข้อเดียวกันพร้อมกัน");
  $("board").classList.add("demo-hl");await dWait(3500,tok);$("board").classList.remove("demo-hl");
  demoSay(2,T,`ช่องที่เด้งอยู่คือ<b>ช่องถัดไป</b> · เริ่มจาก <b>ช่อง ${qI+1}</b>`,`ช่องที่เด้งอยู่คือช่องถัดไปที่ต้องเปิด เริ่มจากช่องที่${thNum(qI+1)}`);
  await dWait(1500,tok);
  await dTap(document.querySelector(`.tile[data-i="${qI}"]`),tok);
  await dUntil(()=>document.querySelector(".card"),9000,tok);await dWait(1200,tok);
  demoSay(3,T,"พิธีกรอ่านคำถาม แล้วเริ่มจับเวลา <span class='dnote'>(ในสาธิตย่อเหลือ 8 วินาที)</span>","พิธีกรอ่านคำถามแล้วกดเริ่มจับเวลา");
  await dWait(2500,tok);
  await dTap($("tOpen"),tok);await dWait(700,tok);
  total=8;left=8;drawTimer();
  await dTap($("tStart"),tok);
  demoSay(4,T,"<b>ทุกทีมเขียนคำตอบลงกระดาษ</b> ไม่ต้องใช้มือถือ","ทุกทีมช่วยกันคิดแล้วเขียนคำตอบลงในกระดาษโดยไม่ต้องใช้มือถือ");
  await dUntil(()=>left<=0&&!timer,20000,tok);await dWait(1500,tok);
  hideTimer();
  demoSay(5,T,"หมดเวลา <b>ทุกทีมยกกระดาษคำตอบขึ้นพร้อมกัน</b>","เมื่อหมดเวลา ทุกทีมยกกระดาษคำตอบขึ้นพร้อมกัน");
  await dWait(3000,tok);
  demoSay(6,T,"พิธีกรกด<b>เฉลย</b>คำตอบที่ถูก","จากนั้นพิธีกรเปิดเฉลยคำตอบที่ถูกต้อง");
  if($("ansCover")){await dTap($("ansCover"),tok);await dWait(2600,tok)}
  demoSay(7,T,"<b>ทีมไหนตอบถูก ได้ 1 แต้ม</b> · ทีม 1 กับทีม 3 ตอบถูก","ทีมที่ตอบถูกได้หนึ่งแต้ม รอบนี้ทีมหนึ่งและทีมสามตอบถูกจึงได้ทีมละหนึ่งแต้ม");
  await dTap(document.querySelector('[data-add="0"][data-d="1"]'),tok);await dWait(400,tok);
  await dTap(document.querySelector('[data-add="2"][data-d="1"]'),tok);await dWait(1600,tok);
  closeOv();await dWait(2500,tok);
  demoBar(`<span class="dtag">${UI.play}โหมดสาธิต</span><div class="dmain"><span class="dstep">จบการสาธิต</span><p class="dtext">เปิดช่องตามลำดับ → เขียนคำตอบบนกระดาษ → ยกกระดาษ แล้วเฉลย → <b>ตอบถูกได้ 1 แต้ม</b></p></div>
    <div class="dbtns"><button class="btn" id="demoAgain">ดูอีกครั้ง</button><button class="btn go" id="demoExit">ออกจากสาธิต</button></div><div class="dprog"><i style="width:100%"></i></div>`);
  speak("จบการสาธิต สรุปคือเปิดช่องตามลำดับ เขียนคำตอบลงกระดาษ ยกกระดาษแล้วเฉลย และทีมที่ตอบถูกได้หนึ่งแต้ม");
  $("demoAgain").onclick=()=>startDemo();$("demoExit").onclick=()=>{nav("host")};
}

function sayName(){
  if(nameSaid||muted)return;
  try{
    nameAudio=nameAudio||new Audio(NAME_MP3);nameAudio.currentTime=0;nameAudio.volume=1;
    const p=nameAudio.play();if(p&&p.then)p.then(()=>{nameSaid=true}).catch(()=>{});else nameSaid=true;
  }catch(e){}
}
function showIntro(){
  if($("intro"))return;
  const el=document.createElement("div");el.id="intro";el.className="intro";el.setAttribute("role","dialog");el.setAttribute("aria-label","วอดส์ What");
  const sp=Array.from({length:18},(_,i)=>`<i style="left:${(i*53)%100}%;top:${(i*37)%62}%;animation-delay:${(i%6)*.45}s;--s:${6+(i%4)*3}px"></i>`).join("");
  el.innerHTML=`<div class="i-spark">${sp}</div>
    <div class="i-road"><i></i></div>
    <svg class="i-car" viewBox="0 0 54 30" aria-hidden="true"><rect x="3" y="9" width="48" height="15" rx="6" fill="#f47b20"/><path d="M13 10l6-7h16l7 7z" fill="#f99a52"/><rect x="21" y="5" width="12" height="5" rx="1" fill="#d8ecff"/><circle cx="15" cy="24" r="5" fill="#173452"/><circle cx="40" cy="24" r="5" fill="#173452"/><rect x="47" y="13" width="4" height="4" rx="1" fill="#fff"/></svg>
    <div class="i-in">
      <span class="i-eye">Company Outing 2569 · Debuz × GAMEINDY</span>
      <h1 class="i-title"><span class="i-year i-word i-thai" id="iYear">${["ว","อ","ด","ส์"].map((ch,i)=>`<span style="animation-delay:${(.55+i*.2).toFixed(2)}s">${ch}</span>`).join("")}</span><span class="i-th i-en">What</span></h1>
      <p class="i-sub">เกมที่ 1 · เปิดการ์ดทีละช่อง ตอบคำถาม เก็บแต้มให้ถึงเป้าหมาย</p>
      <button class="btn hot i-go" id="iGo">${UI.play}เริ่มเกม!</button>
      <span class="i-hint">กด Enter หรือ Spacebar ก็ได้</span>
    </div>
    <button class="i-skip" id="iSkip">ข้าม</button>`;
  document.body.appendChild(el);document.body.classList.add("intro-on");
  const yr=$("iYear"),wait=reduced()?0:1500;
  if(!reduced())[0,1,2,3].forEach(i=>setTimeout(()=>{if(document.body.contains(el))tone(520+i*130,0,.08,"square")},550+i*200));
  setTimeout(()=>{if(!document.body.contains(el))return;yr.classList.add("hit");el.classList.add("ready");sayName();const g=$("iGo");g&&g.focus()},wait);
  let leaving=false;
  const go=()=>{
    if(leaving)return;leaving=true;const needVoice=!nameSaid&&!muted;sayName();setTimeout(()=>sfx("fanfare"),needVoice?1100:0);
    el.classList.add("out");
    setTimeout(()=>{el.remove();document.body.classList.remove("intro-on");
      const bd=$("board");if(bd&&!reduced()){bd.querySelectorAll(".tile").forEach((t,i)=>t.style.setProperty("--i",i));bd.classList.add("enter");setTimeout(()=>bd.classList.remove("enter"),2200)}},reduced()?0:750);
  };
  $("iGo").onclick=go;$("iSkip").onclick=go;
  el.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();go()}});
}

/* ================= routing + start ================= */
let navH=null;
const curH=()=>navH!=null?navH:location.hash.replace("#","");
function nav(h){navH=h;route()}
addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();nav(a.getAttribute("href").slice(1))});
function route(){
  const h=curH();
  const m=/^team-(\d{1,2})$/.exec(h);
  if(!$("ov").hidden)closeOv();
  if(demo&&h!=="demo")exitDemo();
  document.body.classList.toggle("host",!m&&h!=="join"&&h!=="score"&&h!=="qr");
  if(m||h==="join"){view="team";tvTeam=-1;tvShell(`<div class="top"><span class="brand">วอด<em>ส์</em><span class="thname">What</span></span></div><div class="wait">เกมนี้ทุกทีมเขียนคำตอบลงกระดาษ<br>ดูโจทย์และคะแนนได้ที่จอหน้าเวที</div>`);return}
  if(h==="score"){startScorer();return}
  if(h==="qr"){nav("host");return}
  view="host";tvTeam=-1;$("teamView").hidden=true;$("teamView").innerHTML="";$("hostView").hidden=false;
  if(demo)return;
  boot(null);if(useDb()&&logLoaded)st.scores=scoresFrom(rowsNow());renderAll();if(lastBoard)applyBoard(lastBoard);pushLive(true);
  if(h==="demo")setTimeout(startDemo,300);
}
function initCaps(){
  const LOCAL_MSG="หลังบ้าน: โหมดเครื่องเดียว (ข้อมูลอยู่ในเบราว์เซอร์นี้)";
  if(!window.claude||!window.claude.use){setLive(false,LOCAL_MSG);return Promise.resolve()}
  return Promise.all([window.claude.use("db").catch(()=>null),window.claude.use("user").catch(()=>null)]).then(async([d,u])=>{
    db=d;user=u;try{isEditor=u?await u.canEdit():false}catch(e){isEditor=false}
    if(!useDb())setLive(false,LOCAL_MSG);
  });
}
function start(hot){
  boot(hot);buildIbar();
  capsReady=initCaps();
  /* claude.ai: always start on the intro (hash links misroute there). Local file: #score opens the backstage in a 2nd tab */
  navH=location.protocol==="file:"&&location.hash==="#score"?"score":"";
  const h=curH();
  if(!h)renderAll();
  route();
  addEventListener("hashchange",()=>{navH=null;route()});
  if(view==="host"&&h!=="demo")showIntro();
  capsReady.then(()=>{
    const hh=curH();
    if(useDb()){subScores();subConfig();subBoard();if(view==="host"){renderLanes();pushLive(true)}}
  });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
